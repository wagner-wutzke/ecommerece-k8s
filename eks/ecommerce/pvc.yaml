
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: ecommerce
  labels:
    database: kafka
spec:
  storageClassName: ebs-storage
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

