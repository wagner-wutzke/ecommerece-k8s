apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ecommerce
  region: us-east-2
  version: "1.37"

managedNodeGroups:
  - name: workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: true
      publicKeyPath: ~/.ssh/aws_key.pub

addons:
  - name: aws-ebs-csi-driver
    version: latest
#  - name: eks-pod-identity-agent
#    version: latest

#addonsConfig:
#  autoApplyPodIdentityAssociations: true